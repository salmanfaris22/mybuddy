# MyBuddy Connect — single-host deployment for a Linux server with a public IP and a DNS name.
# Read infrastructure/README.md first. Quick start:
#   cp .env.example .env && $EDITOR .env
#   scripts/init-secrets.sh <public IPv4 of this server>
#   docker compose up -d --build
#
# Secrets live in ./secrets (git-ignored, created by scripts/init-secrets.sh) and reach containers
# as mounted files — never as command-line arguments or values in this file.
name: mybuddy-connect

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybuddy
      POSTGRES_DB: mybuddy
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 images keep PGDATA under this path
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybuddy -d mybuddy"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published ports: only connect-api can reach the database, over the internal network.

  connect-api:
    build: ../services/connect-api
    image: mybuddy/connect-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MYBUDDY_LISTEN: "0.0.0.0:8787"
      # The listener is reachable only on the Docker networks below (never published to the host);
      # Caddy is the only public entry point and terminates TLS.
      MYBUDDY_ALLOW_PUBLIC_LISTEN: "1"
      MYBUDDY_TRUST_PROXY: "1"
      MYBUDDY_DATABASE_URL_FILE: /run/secrets/database_url
      MYBUDDY_TURN_SECRET_FILE: /run/secrets/turn_secret
      MYBUDDY_TURN_URLS: "turn:${MYBUDDY_TURN_HOST:?set MYBUDDY_TURN_HOST in .env}:3478?transport=udp,turn:${MYBUDDY_TURN_HOST}:3478?transport=tcp"
      # 12 h: a relayed session can't renew its TURN credentials, so it reconnects (automatically) after this.
      MYBUDDY_TURN_TTL_SECONDS: "43200"
    secrets: [database_url, turn_secret]
    networks: [backend, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on: [connect-api]
    ports:
      - "80:80"        # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      MYBUDDY_DOMAIN: ${MYBUDDY_DOMAIN:?set MYBUDDY_DOMAIN in .env}
      MYBUDDY_ACME_EMAIL: ${MYBUDDY_ACME_EMAIL:?set MYBUDDY_ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  coturn:
    image: coturn/coturn:4.18-alpine
    restart: unless-stopped
    # Host networking: TURN must see the real public IP and own its relay port range; Docker NAT
    # and per-port proxies break both. The config denies relaying into private networks.
    network_mode: host
    volumes:
      - ./secrets/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    internal: true   # no route to the internet; Postgres lives only here
  edge: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url
  turn_secret:
    file: ./secrets/turn_secret
